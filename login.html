<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - HD-ACADEMY</title>
    <style>
body {
    margin: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: rgb(240, 215, 183);
    font-family: Arial, sans-serif;
}
form { box-shadow: 0 10px 70px rgb(121, 121, 232); }
body > h1 { font-size: 45px; margin-bottom: 25px; }
strong { color: coral; }
em { color: blue; }
#loginForm {
    width: 90%;
    max-width: 500px;
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid rgb(0, 102, 255);
    box-sizing: border-box;
}
#loginForm h2 { text-align: center; color: rgb(0, 102, 255); margin-bottom: 25px; }
#loginForm label { display: block; margin-bottom: 8px; font-size: 16px; font-weight: bold; }
#loginForm input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
}
#loginForm input:focus { outline: none; border: 2px solid rgb(0, 102, 255); }
#loginForm button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: rgb(0, 102, 255);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
#loginForm button:focus { background-color: rgb(0, 255, 55); }
#loginForm #message { color: #c40018; font-weight: bold; margin: 0 0 15px; min-height: 1.2em; }
#loginForm p { text-align: center; margin-top: 20px; }
#loginForm a { color: rgb(0, 102, 255); font-weight: bold; text-decoration: none; }
#loginForm a:hover { text-decoration: underline; }
p { margin-bottom: 20px; }
@media (max-width: 500px) {
    #loginForm { padding: 20px; }
    body > h1 { font-size: 35px; text-align: center; }
    h1 > img { height: 50px; width: 50px; }
}
    </style>
</head>
<body>

    <h1><img src="1790783313106.jpg" alt="logo" height="100" width="100"> <strong>HD</strong><em>ACADEMY</em></h1>

    <form id="loginForm">
        <h2>Inscription</h2>

        <label for="nom">Votre nom :</label>
        <input type="text" id="nom" autocomplete="family-name" required>

        <label for="prenom">Votre prénom :</label>
        <input type="text" id="prenom" autocomplete="given-name" required>

        <label for="telephone">Votre numéro de téléphone :</label>
        <input type="tel" id="telephone" autocomplete="tel" required>

        <label for="whatsapp">Votre numéro WhatsApp :</label>
        <input type="tel" id="whatsapp" required>

        <label for="email">Votre e-mail :</label>
        <input type="email" id="email" autocomplete="email" required>

        <label for="mdp">Créez un mot de passe :</label>
        <input type="password" id="mdp" placeholder="6 caractères minimum" minlength="6" autocomplete="new-password" required>

        <label for="mdp2">Confirmez le mot de passe :</label>
        <input type="password" id="mdp2" autocomplete="new-password" required>

        <p id="message" role="alert"></p>

        <button type="submit">Créez votre compte</button>

        <!-- <p>
            Déjà un compte ?
            <a href="login-0.html">Se connecter</a>
        </p> -->
        <p style="font-size:12px;color:#888;margin:10px 0 0;">Version 2</p>
    </form>

    <script>
    // Transforme le mot de passe en empreinte : on ne garde jamais le mot de passe lui-même
    async function hashMotDePasse(email, mdp) {
      const donnees = new TextEncoder().encode(email.toLowerCase() + ":" + mdp);
      const empreinte = await crypto.subtle.digest("SHA-256", donnees);
      return Array.from(new Uint8Array(empreinte))
        .map(function (b) { return b.toString(16).padStart(2, "0"); })
        .join("");
    }

    const formulaire = document.getElementById("loginForm");
    const message = document.getElementById("message");

    formulaire.addEventListener("submit", async function (e) {
      e.preventDefault();

      const prenom = document.getElementById("prenom").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const mdp = document.getElementById("mdp").value;
      const confirmation = document.getElementById("mdp2").value;

      if (mdp.length < 6) {
        message.textContent = "Le mot de passe doit contenir au moins 6 caractères.";
        return;
      }
      if (mdp !== confirmation) {
        message.textContent = "Les deux mots de passe ne sont pas identiques.";
        return;
      }

      try {
        const hash = await hashMotDePasse(email, mdp);
        localStorage.setItem("learnprod_compte", JSON.stringify({ email: email, prenom: prenom, hash: hash }));
        localStorage.setItem("learnprod_inscrit", "oui");
        localStorage.setItem("learnprod_prenom", prenom);
        if (!localStorage.getItem("learnprod_compte")) { throw new Error("compte non enregistré"); }
      } catch (err) {
        message.textContent = "Impossible d'enregistrer l'inscription sur cet appareil.";
        return;
      }

      alert("Compte créé ! Tu peux maintenant lire les cours.");
      window.location.href = "index.html";
    });
    </script>
</body>
</html>
