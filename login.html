<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - HD-ACADEMY</title>
    <style>
        body {
    margin: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: rgb(240, 215, 183);
    font-family: Arial, sans-serif;
}
form { box-shadow: 0 10px 70px rgb(121, 121, 232); }

/* Logo */
body > h1 { font-size: 45px; margin-bottom: 25px; }
strong { color: coral; }
em { color: blue; }

/* Formulaire */
#loginForm {
    width: 90%;
    max-width: 500px;
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid rgb(0, 102, 255);
    box-sizing: border-box;
}
#loginForm h2 { text-align: center; color: rgb(0, 102, 255); margin-bottom: 25px; }
#loginForm label { display: block; margin-bottom: 8px; font-size: 16px; font-weight: bold; }
#loginForm input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
}
#loginForm input:focus { outline: none; border: 2px solid rgb(0, 102, 255); }

/* Bouton */
#loginForm button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: rgb(0, 102, 255);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
#loginForm button:focus { background-color: rgb(0, 255, 55); }

/* Message d'erreur */
#loginForm #message { color: #c40018; font-weight: bold; margin: 0 0 15px; min-height: 1.2em; }

/* Lien connexion */
#loginForm p { text-align: center; margin-top: 20px; }
#loginForm a { color: rgb(0, 102, 255); font-weight: bold; text-decoration: none; }
#loginForm a:hover { text-decoration: underline; }
p { margin-bottom: 20px; }

/* Téléphone */
@media (max-width: 500px) {
    #loginForm { padding: 20px; }
    body > h1 { font-size: 35px; text-align: center; }
    h1 > img { height: 50px; width: 50px; }
}
    </style>
</head>
<body>

    <h1><img src="1790783313106.jpg" alt="logo" height="100" width="100"> <strong>HD</strong><em>ACADEMY</em></h1>

    <form id="loginForm">
        <h2>Inscription</h2>

        <label for="nom">Votre nom :</label>
        <input type="text" id="nom" name="nom" placeholder="Ex: YYYYYYY" autocomplete="family-name" required>

        <label for="prenom">Votre prénom :</label>
        <input type="text" id="prenom" name="prenom" placeholder="Ex: Xxxxxxxx" autocomplete="given-name" required>

        <label for="telephone">Votre numéro de téléphone :</label>
        <input type="tel" id="telephone" name="telephone" placeholder="Ex: 01 46 63 73 74" autocomplete="tel" required>

        <label for="whatsapp">Votre numéro WhatsApp :</label>
        <input type="tel" id="whatsapp" name="whatsapp" required>

        <label for="email">Votre e-mail :</label>
        <input type="email" id="email" name="email" placeholder="Ex: nom@exemple.com" autocomplete="email" required>

        <label for="mdp">Créez un mot de passe :</label>
        <input type="password" id="mdp" name="mdp" placeholder="6 caractères minimum" minlength="6" autocomplete="new-password" required>

        <label for="mdp2">Confirmez le mot de passe :</label>
        <input type="password" id="mdp2" name="mdp2" autocomplete="new-password" required>

        <p id="message" role="alert"></p>

        <button type="submit">Créez votre compte</button>

        <p>
            Déjà un compte ?
            <!-- <a href="#">Se connecter</a> -->
            <a href="login-0.html">Se connecter</a>
        </p>
    </form>

    <script src="login.js"></script>
</body>
</html>
