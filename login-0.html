<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - HD-ACADEMY</title>
    <style>
body {
    margin: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: rgb(240, 215, 183);
    font-family: Arial, sans-serif;
}
form { box-shadow: 0 10px 70px rgb(121, 121, 232); }
body > h1 { font-size: 45px; margin-bottom: 25px; }
strong { color: coral; }
em { color: blue; }
#loginForm {
    width: 90%;
    max-width: 500px;
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid rgb(0, 102, 255);
    box-sizing: border-box;
}
#loginForm h2 { text-align: center; color: rgb(0, 102, 255); margin-bottom: 25px; }
#loginForm label { display: block; margin-bottom: 8px; font-size: 16px; font-weight: bold; }
#loginForm input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
}
#loginForm input:focus { outline: none; border: 2px solid rgb(0, 102, 255); }
#loginForm button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: rgb(0, 102, 255);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
#loginForm button:focus { background-color: rgb(0, 255, 55); }
#loginForm #message { color: #c40018; font-weight: bold; margin: 0 0 15px; min-height: 1.2em; }
#loginForm p { text-align: center; margin-top: 20px; }
#loginForm a { color: rgb(0, 102, 255); font-weight: bold; text-decoration: none; }
#loginForm a:hover { text-decoration: underline; }
p { margin-bottom: 20px; }
@media (max-width: 500px) {
    #loginForm { padding: 20px; }
    body > h1 { font-size: 35px; text-align: center; }
    h1 > img { height: 50px; width: 50px; }
}
    </style>
</head>
<body>

    <h1><img src="1790783313106.jpg" alt="logo" height="100" width="100"> <strong>HD</strong><em>ACADEMY</em></h1>

    <form id="loginForm">
        <h2>Connexion</h2>

        <label for="loginEmail">Votre e-mail :</label>
        <input type="email" id="loginEmail" autocomplete="email" required>

        <label for="loginPassword">Mot de passe :</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required>

        <p id="message" role="alert"></p>

        <button type="submit">Se connecter</button>

        <p>
            Vous n'avez pas de compte ?
            <a href="login.html">Créez un compte</a>
        </p>
    </form>

    <script>
    // Transforme le mot de passe en empreinte : on ne garde jamais le mot de passe lui-même
    async function hashMotDePasse(email, mdp) {
      const donnees = new TextEncoder().encode(email.toLowerCase() + ":" + mdp);
      const empreinte = await crypto.subtle.digest("SHA-256", donnees);
      return Array.from(new Uint8Array(empreinte))
        .map(function (b) { return b.toString(16).padStart(2, "0"); })
        .join("");
    }

    const formulaire = document.getElementById("loginForm");
    const message = document.getElementById("message");

    formulaire.addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("loginEmail").value.trim().toLowerCase();
      const mdp = document.getElementById("loginPassword").value;

      let compte = null;
      try { compte = JSON.parse(localStorage.getItem("learnprod_compte")); } catch (err) { compte = null; }

      if (!compte) {
        message.textContent = "Aucun compte trouvé sur cet appareil. Crée d'abord ton compte.";
        return;
      }

      try {
        const hash = await hashMotDePasse(email, mdp);
        if (email === compte.email && hash === compte.hash) {
          localStorage.setItem("learnprod_inscrit", "oui");
          window.location.href = "index.html";
        } else {
          message.textContent = "E-mail ou mot de passe incorrect.";
        }
      } catch (err) {
        message.textContent = "Connexion impossible sur ce navigateur.";
      }
    });
    </script>
</body>
</html>
