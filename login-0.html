<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - HD-ACADEMY</title>
    <style>
body {
    margin: 20px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: rgb(240, 215, 183);
    font-family: Arial, sans-serif;
    
}
form{
    box-shadow: 0 10px 70px rgb(121, 121, 232);
} 

/* Logo */
body > h1 {
    font-size: 45px;
    margin-bottom: 25px;
}

strong {
    color: coral;
}

em {
    color: blue;
}

/* Formulaire */
#loginForm {
    width: 90%;
    max-width: 500px;
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    border: 2px solid rgb(0, 102, 255);
    box-sizing: border-box;
}

/* Titre */
#loginForm h2 {
    text-align: center;
    color: rgb(0, 102, 255);
    margin-bottom: 25px;
}

/* Labels */
#loginForm label {
    display: block;
    margin-bottom: 8px;
    font-size: 16px;
    font-weight: bold;
}

/* Champs */
#loginForm input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    box-sizing: border-box;
    font-size: 15px;
}

#loginForm input:focus {
    outline: none; 
    border: 2px solid rgb(0, 102, 255);
}

/* Bouton */
#loginForm button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background-color: rgb(0, 102, 255);
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}
#loginForm button:focus{
    background-color: rgb(0, 255, 55);
}

/* Lien inscription */
#loginForm p {
    text-align: center;
    margin-top: 20px;
}

#loginForm a {
    color: rgb(0, 102, 255);
    font-weight: bold;
    text-decoration: none;
}

#loginForm a:hover {
    text-decoration: underline;
}
p{
    margin-bottom: 20px;
}

/* Téléphone */
@media (max-width: 500px) {
    #loginForm {
        padding: 20px;
    }

    body > h1 {
        font-size: 35px;
        text-align: center;
    }
    h1 > img{
        height: 50px;
        width: 50px;
    }
}
</style>
</head>

<body>

    <h1> <img src="1790783313106.jpg" alt="logo" height="100px" width="100px"> <strong>HD</strong><em>ACADEMY</em></h1>

    <form id="loginForm">

        <h2>Connexion</h2>

        <label for="loginEmail">Votre Mail :</label>
        <input type="email" id="loginEmail" required>

        <br><br>

        <label for="loginPassword">Mot de passe :</label>
        <input type="password" id="loginPassword" required>

        <br><br>

        <button type="submit">Se connecter</button>

        <p>
            Vous n'avez pas un compte ?
            <a href="login.html">Créez un compte</a>
        </p>

    </form>

    <script>
        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function(e) {
            e.preventDefault();

            const nom = document.getElementById("loginNom").value;
            const password = document.getElementById("loginPassword").value;

            const nomEnregistre = localStorage.getItem("nom");
            const passwordEnregistre = localStorage.getItem("password");

            if (nom === nomEnregistre && password === passwordEnregistre) {

                localStorage.setItem("isLogged", "true");

                alert("Connexion réussie !");

                window.location.href = "ChatGPT.html";

            } else {
                alert("Nom ou mot de passe incorrect.");
            }
        });
    </script>

</body>
</html>
